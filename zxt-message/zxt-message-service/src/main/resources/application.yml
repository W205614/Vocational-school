server:
  port: 8085
  tomcat:
    uri-encoding: UTF-8
  shutdown: graceful
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: message-service
  cloud:
    nacos:
      config:
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1500
            readTimeout: 5000
            loggerLevel: basic
  config:
    import:
      - optional:nacos:shared-spring.yaml?refreshEnabled=false
      - optional:nacos:shared-redis.yaml?refreshEnabled=false
      - optional:nacos:shared-mybatis.yaml?refreshEnabled=false
      - optional:nacos:shared-logs.yaml?refreshEnabled=false
      - optional:nacos:shared-feign.yaml?refreshEnabled=false
      - optional:nacos:shared-mq.yaml?refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
zxt:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhixuetang.message.controller
    title: 职学堂 - 消息中心接口文档
    description: 该服务用于站内信、通知管理、短信发送等功能
    contact-name: 职学堂维护者
    contact-url: https://github.com/W205614/Vocational-school
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /students/register
        - /users/detail/{isStaff}
        - /users/list
        - GET:/users/{id}
        - /users/{id}/type
        - /users/ids
  jdbc:
    database: tj_message
  sms:
    ali:
      accessId: ${ZXT_MESSAGE_ZXT_SMS_ALI_ACCESSID:}
      accessSecret: ${ZXT_MESSAGE_ZXT_SMS_ALI_ACCESSSECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
          additional-path: server:/readyz
