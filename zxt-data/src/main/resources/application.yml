server:
  port: 8093
  tomcat:
    uri-encoding: UTF-8
  shutdown: graceful
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: data-service
  cloud:
    nacos:
      config:
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1500
            readTimeout: 5000
            loggerLevel: basic
  config:
    import:
      - optional:nacos:shared-spring.yaml?refreshEnabled=false
      - optional:nacos:shared-redis.yaml?refreshEnabled=false
      - optional:nacos:shared-mybatis.yaml?refreshEnabled=false
      - optional:nacos:shared-logs.yaml?refreshEnabled=false
      - optional:nacos:shared-feign.yaml?refreshEnabled=false
      - optional:nacos:shared-mq.yaml?refreshEnabled=false
      - optional:nacos:shared-xxljob.yaml?refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
zxt:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhixuetang.data.controller
    title: 职学堂 - 数据中心接口文档
    description: 该服务包含数据看板统计的功能
    contact-name: 职学堂维护者
    contact-url: https://github.com/W205614/Vocational-school
    version: v1.0
  jdbc:
    database: tj_data
  auth:
    resource:
      enable: true
  reliability:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
          additional-path: server:/readyz
