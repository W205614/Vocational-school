server:
  port: 8087
  tomcat:
    uri-encoding: UTF-8
  error:
    include-message: always
  shutdown: graceful
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: pay-service
  cloud:
    nacos:
      config:
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1500
            readTimeout: 5000
            loggerLevel: basic
  config:
    import:
    - optional:nacos:shared-spring.yaml?refreshEnabled=false
    - optional:nacos:shared-redis.yaml?refreshEnabled=false
    - optional:nacos:shared-mybatis.yaml?refreshEnabled=false
    - optional:nacos:shared-logs.yaml?refreshEnabled=false
    - optional:nacos:shared-feign.yaml?refreshEnabled=false
    - optional:nacos:shared-mq.yaml?refreshEnabled=false
    - optional:nacos:shared-xxljob.yaml?refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.pay.controller
    title: 天机学堂 - 支付中心接口文档
    description: 该服务提供微信、支付宝等各种平台的支付、退款等功能
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
  jdbc:
    database: tj_pay
  pay:
    notifyHost: https://6b9f16dd.r2.cpolar.top/ps
    ali:
      appId: ${TJ_PAY_TJ_PAY_ALI_APPID:}
      merchantPrivateKey: ${TJ_PAY_TJ_PAY_ALI_MERCHANTPRIVATEKEY:}
      publicKey: ${TJ_PAY_TJ_PAY_ALI_PUBLICKEY:}
    wx:
      appId: ${TJ_PAY_TJ_PAY_WX_APPID:}
      mchId: ${TJ_PAY_TJ_PAY_WX_MCHID:}
      mchSerialNo: ${TJ_PAY_TJ_PAY_WX_MCHSERIALNO:}
      privateKey: ${TJ_PAY_TJ_PAY_WX_PRIVATEKEY:}
      apiV3Key: ${TJ_PAY_TJ_PAY_WX_APIV3KEY:}
  auth:
    resource:
      excludeLoginPaths:
      - /pay-orders/**
      - /refund-orders/**
      - /pay-channels/list
      - /notify/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
          additional-path: server:/readyz
