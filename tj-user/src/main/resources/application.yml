server:
  port: 8082
  tomcat:
    uri-encoding: UTF-8
  shutdown: graceful
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: user-service
  cloud:
    nacos:
      config:
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1500
            readTimeout: 5000
            loggerLevel: basic
  config:
    import:
    - optional:nacos:shared-spring.yaml?refreshEnabled=false
    - optional:nacos:shared-redis.yaml?refreshEnabled=false
    - optional:nacos:shared-mybatis.yaml?refreshEnabled=false
    - optional:nacos:shared-logs.yaml?refreshEnabled=false
    - optional:nacos:shared-feign.yaml?refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.user.controller
    title: 天机学堂 - 用户中心接口文档
    description: 该服务用户管理、用户信息管理
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
      - /students/register
      - /users/detail/{isStaff}
      - /users/list
      - GET:/users/{id}
      - /users/{id}/type
      - /users/ids
      - /users/me
  jdbc:
    database: tj_user
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
          additional-path: server:/readyz
