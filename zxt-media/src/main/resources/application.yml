server:
  port: 8084
  tomcat:
    uri-encoding: UTF-8
  shutdown: graceful
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: media-service
  cloud:
    nacos:
      config:
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1500
            readTimeout: 5000
            loggerLevel: basic
  config:
    import:
      - optional:nacos:shared-spring.yaml?refreshEnabled=false
      - optional:nacos:shared-redis.yaml?refreshEnabled=false
      - optional:nacos:shared-logs.yaml?refreshEnabled=false
      - optional:nacos:shared-mybatis.yaml?refreshEnabled=false
      - optional:nacos:shared-feign.yaml?refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
zxt:
  swagger:
    enable: true
    package-path: com.zhixuetang.media.controller
    title: 职学堂 - 媒资中心接口文档
    description: 该服务包含图片管理、媒资管理等
    contact-name: 职学堂维护者
    contact-url: https://github.com/W205614/Vocational-school
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
        - /trial-content/**
  jdbc:
    database: tj_media
  platform:
    file: TENCENT
    media: TENCENT
  tencent:
    appId: ${ZXT_MEDIA_ZXT_TENCENT_APPID:}
    secretId: ${ZXT_MEDIA_ZXT_TENCENT_SECRETID:}
    secretKey: ${ZXT_MEDIA_ZXT_TENCENT_SECRETKEY:}
    vod:
      enable: true
      vodValidSeconds: 7776000
      region: ap-shanghai
      procedure: wisehub-base
      urlKey: TENCENT_URL_KEY_PLACEHOLDER
      pfcg: basicDrmPreset
    cos:
      enable: true
      region: ap-shanghai
      bucket: wisehub
      multipartUploadThreshold: 5242880
      minimumUploadPartSize: 1048576
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
          additional-path: server:/readyz
