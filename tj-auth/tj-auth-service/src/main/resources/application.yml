server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8
  shutdown: graceful
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auth-service
  cloud:
    nacos:
      config:
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1500
            readTimeout: 5000
            loggerLevel: basic
  config:
    import:
    - optional:nacos:shared-spring.yaml?refreshEnabled=false
    - optional:nacos:shared-redis.yaml?refreshEnabled=false
    - optional:nacos:shared-mybatis.yaml?refreshEnabled=false
    - optional:nacos:shared-logs.yaml?refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
encrypt:
  key-store:
    alias: tjxt
    location: classpath:tjxt.jks
    password: ${TJ_AUTH_ENCRYPT_KEY_STORE_PASSWORD:}
    secret: ${TJ_AUTH_ENCRYPT_KEY_STORE_SECRET:}
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.auth.controller
    title: 天机学堂 - 权限微服务接口文档
    description: 该服务用于管理权限相关信息
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
  auth:
    resource:
      enable: true
      includeLoginPaths:
      - /menus/me
      - /accounts/logout
  jdbc:
    database: tj_auth
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
          additional-path: server:/readyz
