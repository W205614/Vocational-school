server:
  port: 10010
  tomcat:
    uri-encoding: UTF-8
  shutdown: graceful
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: gateway-service
  cloud:
    nacos:
      config:
        file-extension: yaml
    gateway:
      server:
        webflux:
          routes:
          - id: ms
            uri: lb://media-service
            predicates:
            - Path=/ms/**
            filters:
            - StripPrefix=1
          - id: as
            uri: lb://auth-service
            predicates:
            - Path=/as/**
            filters:
            - PreserveHostHeader
            - StripPrefix=1
          - id: ds
            uri: lb://data-service
            predicates:
            - Path=/ds/**
            filters:
            - StripPrefix=1
          - id: sms
            uri: lb://message-service
            predicates:
            - Path=/sms/**
            filters:
            - StripPrefix=1
          - id: us
            uri: lb://user-service
            predicates:
            - Path=/us/**
            filters:
            - StripPrefix=1
          - id: cs
            uri: lb://course-service
            predicates:
            - Path=/cs/**
            filters:
            - StripPrefix=1
          - id: os
            uri: lb://order-service
            predicates:
            - Path=/os/**
            filters:
            - StripPrefix=1
          - id: ss
            uri: lb://search-service
            predicates:
            - Path=/ss/**
            filters:
            - StripPrefix=1
          - id: ls
            uri: lb://learning-service
            predicates:
            - Path=/ls/**
            filters:
            - StripPrefix=1
          - id: ps
            uri: lb://pay-service
            predicates:
            - Path=/ps/**
            filters:
            - StripPrefix=1
          - id: ts
            uri: lb://trade-service
            predicates:
            - Path=/ts/**
            filters:
            - StripPrefix=1
          - id: es
            uri: lb://exam-service
            predicates:
            - Path=/es/**
            filters:
            - StripPrefix=1
          - id: rs
            uri: lb://remark-service
            predicates:
            - Path=/rs/**
            filters:
            - StripPrefix=1
          - id: prs
            uri: lb://promotion-service
            predicates:
            - Path=/prs/**
            filters:
            - StripPrefix=1
          globalcors:
            add-to-simple-url-handler-mapping: true
            corsConfigurations:
              '[/**]':
                allowedOriginPatterns:
                - '*'
                allowedMethods:
                - GET
                - POST
                - DELETE
                - PUT
                - OPTIONS
                allowedHeaders: '*'
                allowCredentials: true
                maxAge: 360000
  config:
    import:
    - optional:nacos:shared-spring.yaml?refreshEnabled=false
    - optional:nacos:shared-redis.yaml?refreshEnabled=false
    - optional:nacos:shared-logs.yaml?refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
logging:
  level:
    com.tianji: debug
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis,authentication
          additional-path: server:/readyz
