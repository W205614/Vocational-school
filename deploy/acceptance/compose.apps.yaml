services:
  app-data:
    image: vocational-acceptance/data:java21
    profiles:
    - apps
    restart: unless-stopped
    env_file:
    - ./.local/containers/env
    environment:
      APP_PORT: '23895'
    ports:
    - 127.0.0.1:23895:23895
    volumes:
    - ./.local/containers/full/data.yml:/run/acceptance/application.yml:ro
    - ./.local/containers/signing.jks:/run/acceptance/signing.jks:ro
    - ./.local/objects:/run/objects
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test:
      - CMD
      - java
      - -Xms16m
      - -Xmx32m
      - -cp
      - /app/health
      - HealthProbe
      interval: 10s
      timeout: 4s
      start_period: 40s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
