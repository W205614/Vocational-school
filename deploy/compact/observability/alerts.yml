groups:
  - name: compact-reliability
    rules:
      - alert: ServiceUnavailable
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: 'A Zhixuetang module cannot be scraped' }
      - alert: EventDeliveryBacklog
        expr: zxt_events_oldest_seconds > 60
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'Durable events have been delayed for over one minute' }
      - alert: FailedDurableWork
        expr: zxt_events_dead > 0 or zxt_consumer_failures > 0 or zxt_operations_retry_exhausted > 0
        for: 30s
        labels: { severity: warning }
        annotations: { summary: 'Durable work requires investigation or replay' }
      - alert: BusinessOperationBacklog
        expr: zxt_operations_oldest_seconds > 60
        for: 1m
        labels: { severity: warning }
        annotations:
          { summary: 'A durable business operation has remained pending for over one minute' }
      - alert: ReliabilityMetricsStale
        expr: time() - zxt_reliability_metrics_last_success_timestamp_seconds > 60
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'Reliability database metrics have not refreshed successfully' }
      - alert: PaymentNeedsReconciliation
        expr: zxt_payment_reconciliation_dead > 0 or zxt_payment_anomalies > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'Payment facts require review' }
      - alert: SeasonSettlementBlocked
        expr: zxt_seasons_blocked > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'A past learning season remains blocked' }
      - alert: BackupFailed
        expr: zxt_backup_last_failure_timestamp_seconds > zxt_backup_last_success_timestamp_seconds
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'The latest attempted full backup failed' }
      - alert: BackupStale
        expr: time() - zxt_backup_last_success_timestamp_seconds > 93600
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'No verified full backup within 26 hours' }
