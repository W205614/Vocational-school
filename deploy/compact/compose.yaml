name: tianji-compact
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${ACCEPTANCE_DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
    - --default-time-zone=+08:00
    - --innodb-buffer-pool-size=256M
    - --max-connections=160
    ports:
    - 127.0.0.1:24316:3306
    volumes:
    - compact_mysql:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -N -e "SELECT 1"
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  redis:
    image: redis:7.4-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory
    - 192mb
    - --maxmemory-policy
    - noeviction
    ports:
    - 127.0.0.1:24379:6379
    volumes:
    - compact_redis:/data
    mem_limit: 256m
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: tianji
      RABBITMQ_DEFAULT_PASS: ${ACCEPTANCE_MQ_PASSWORD}
    ports:
    - 127.0.0.1:24373:5672
    volumes:
    - compact_rabbit:/var/lib/rabbitmq
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
    - 127.0.0.1:24920:9200
    volumes:
    - compact_search_v9:/usr/share/elasticsearch/data
    mem_limit: 1536m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9200/_cluster/health
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  app-identity:
    image: tianji-compact/identity:local
    restart: unless-stopped
    env_file:
    - ./.local/app.env
    ports:
    - 127.0.0.1:24001:24001
    volumes:
    - ./.local/configs/identity.yml:/run/compact/configs/identity.yml:ro
    - ./.local/configs/auth.yml:/run/compact/configs/auth.yml:ro
    - ./.local/configs/user.yml:/run/compact/configs/user.yml:ro
    - ./.local/signing.jks:/run/compact/signing.jks:ro
    mem_limit: 1536m
    environment:
      APP_PORT: '24001'
    command:
    - --spring.config.location=file:/run/compact/configs/identity.yml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - java
      - -Xms16m
      - -Xmx32m
      - -cp
      - /app/health
      - HealthProbe
      interval: 10s
      timeout: 4s
      start_period: 90s
      retries: 30
    sysctls:
      net.ipv4.ip_local_reserved_ports: 24001,25001,25002,25003,25004
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  app-commerce:
    image: tianji-compact/commerce:local
    restart: unless-stopped
    env_file:
    - ./.local/app.env
    ports:
    - 127.0.0.1:24002:24002
    volumes:
    - ./.local/configs/commerce.yml:/run/compact/configs/commerce.yml:ro
    - ./.local/configs/trade.yml:/run/compact/configs/trade.yml:ro
    - ./.local/configs/pay.yml:/run/compact/configs/pay.yml:ro
    - ./.local/configs/promotion.yml:/run/compact/configs/promotion.yml:ro
    mem_limit: 1536m
    environment:
      APP_PORT: '24002'
    command:
    - --spring.config.location=file:/run/compact/configs/commerce.yml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - java
      - -Xms16m
      - -Xmx32m
      - -cp
      - /app/health
      - HealthProbe
      interval: 10s
      timeout: 4s
      start_period: 90s
      retries: 30
    sysctls:
      net.ipv4.ip_local_reserved_ports: 24002,25002,25003,25004,25005
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  app-education:
    image: tianji-compact/education:local
    restart: unless-stopped
    env_file:
    - ./.local/app.env
    ports:
    - 127.0.0.1:24003:24003
    volumes:
    - ./.local/configs/education.yml:/run/compact/configs/education.yml:ro
    - ./.local/configs/course.yml:/run/compact/configs/course.yml:ro
    - ./.local/configs/learning.yml:/run/compact/configs/learning.yml:ro
    - ./.local/configs/exam.yml:/run/compact/configs/exam.yml:ro
    - ./.local/configs/remark.yml:/run/compact/configs/remark.yml:ro
    mem_limit: 1536m
    environment:
      APP_PORT: '24003'
    command:
    - --spring.config.location=file:/run/compact/configs/education.yml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - java
      - -Xms16m
      - -Xmx32m
      - -cp
      - /app/health
      - HealthProbe
      interval: 10s
      timeout: 4s
      start_period: 90s
      retries: 30
    sysctls:
      net.ipv4.ip_local_reserved_ports: 24003,25003,25004,25005,25006
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  app-support:
    image: tianji-compact/support:local
    restart: unless-stopped
    env_file:
    - ./.local/app.env
    ports:
    - 127.0.0.1:24004:24004
    volumes:
    - ./.local/configs/support.yml:/run/compact/configs/support.yml:ro
    - ./.local/configs/media.yml:/run/compact/configs/media.yml:ro
    - ./.local/configs/search.yml:/run/compact/configs/search.yml:ro
    - ./.local/configs/message.yml:/run/compact/configs/message.yml:ro
    - ./.local/configs/data.yml:/run/compact/configs/data.yml:ro
    - ./.local/objects:/run/objects
    mem_limit: 1536m
    environment:
      APP_PORT: '24004'
    command:
    - --spring.config.location=file:/run/compact/configs/support.yml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - java
      - -Xms16m
      - -Xmx32m
      - -cp
      - /app/health
      - HealthProbe
      interval: 10s
      timeout: 4s
      start_period: 90s
      retries: 30
    sysctls:
      net.ipv4.ip_local_reserved_ports: 24004,25004,25005,25006,25007
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  app-gateway:
    image: tianji-compact/gateway:local
    restart: unless-stopped
    env_file:
    - ./.local/app.env
    ports:
    - 127.0.0.1:24310:24310
    volumes:
    - ./.local/ops-status:/run/ops-status:ro
    - ./.local/configs/gateway.yml:/run/compact/configs/gateway.yml:ro
    mem_limit: 768m
    environment:
      APP_PORT: '24310'
    command:
    - --spring.config.location=file:/run/compact/configs/gateway.yml
    depends_on:
      redis:
        condition: service_healthy
      app-identity:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - java
      - -Xms16m
      - -Xmx32m
      - -cp
      - /app/health
      - HealthProbe
      interval: 10s
      timeout: 4s
      start_period: 90s
      retries: 30
    sysctls:
      net.ipv4.ip_local_reserved_ports: '24310'
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  web-student:
    image: tianji-compact/student:local
    environment:
      GW_UPSTREAM: app-gateway:24310
    ports:
    - 127.0.0.1:24500:8080
    mem_limit: 128m
    depends_on:
      app-gateway:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  web-admin:
    image: tianji-compact/admin:local
    environment:
      GW_UPSTREAM: app-gateway:24310
    ports:
    - 127.0.0.1:24501:8080
    mem_limit: 128m
    depends_on:
      app-gateway:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 90s
  prometheus:
    restart: unless-stopped
    logging: &id001
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 30s
    image: prom/prometheus:v3.15.0
    mem_limit: 256m
    ports:
    - 127.0.0.1:24590:9090
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=256MB
    - --storage.tsdb.wal-compression
    - --storage.tsdb.wal-segment-size=16MB
    volumes:
    - ./.local/observability:/etc/prometheus:ro
    - compact_prometheus:/prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9090/-/ready
      interval: 15s
      timeout: 4s
      retries: 20
  alertmanager:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 30s
    image: prom/alertmanager:v0.34.1
    mem_limit: 128m
    ports:
    - 127.0.0.1:24591:9093
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    - --data.retention=48h
    - --cluster.listen-address=
    volumes:
    - ./.local/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - compact_alertmanager:/alertmanager
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9093/-/ready
      interval: 15s
      timeout: 4s
      retries: 20
  grafana:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 30s
    image: grafana/grafana:13.2.4
    mem_limit: 256m
    ports:
    - 127.0.0.1:24592:3000
    environment:
      GF_SECURITY_ADMIN_USER: tianji
      GF_SECURITY_ADMIN_PASSWORD: ${ACCEPTANCE_GRAFANA_PASSWORD:?Existing observability
        password required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
    - ./.local/observability/grafana:/etc/grafana/provisioning:ro
    - ./.local/observability/dashboards:/run/dashboards:ro
    - compact_grafana:/var/lib/grafana
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:3000/api/health
      interval: 15s
      timeout: 4s
      retries: 20
volumes:
  compact_mysql: {}
  compact_redis: {}
  compact_rabbit: {}
  compact_search: {}
  compact_search_v9: {}
  compact_prometheus: {}
  compact_grafana: {}
  compact_alertmanager: {}
