      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
  app-message:
    image: tianji-final/message:ee045c7
    restart: unless-stopped
    env_file:
    - ./.local/app.env
    environment:
      APP_PORT: '23887'
    ports:
