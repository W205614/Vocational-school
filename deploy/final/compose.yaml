  app-gateway:
    image: tianji-final/gateway:ee045c7
    restart: unless-stopped
    env_file:
    - ./.local/app.env
    environment:
      APP_PORT: '23310'
    ports:
    - 127.0.0.1:23310:23310
    volumes:
    - ./.local/configs/gateway.yml:/run/acceptance/application.yml:ro
    - ./.local/signing.jks:/run/acceptance/signing.jks:ro
    - ./.local/objects:/run/objects
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test:
      - CMD
      - java
      - -Xms16m
      - -Xmx32m
      - -cp
      - /app/health
      - HealthProbe
      interval: 10s
      timeout: 4s
      start_period: 40s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app-auth:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${FINAL_DB_PASSWORD:?Set private final .env}
      TZ: Asia/Shanghai
    command:
    - --default-time-zone=+08:00
    - --innodb-buffer-pool-size=256M
    - --max-connections=200
    ports:
    - 127.0.0.1:23316:3306
    volumes:
    - final_mysql:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -N -e 'SELECT 1'
      interval: 5s
      timeout: 3s
      retries: 60
    mem_limit: 1g
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    ports:
    - 127.0.0.1:23379:6379
    volumes:
    - final_redis:/data
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory
    - 96mb
    - --maxmemory-policy
    - noeviction
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: tianji
      RABBITMQ_DEFAULT_PASS: ${FINAL_MQ_PASSWORD:?Set private final .env}
    ports:
    - 127.0.0.1:23372:15672
    - 127.0.0.1:23373:5672
    volumes:
    - final_rabbit:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
    - 127.0.0.1:23920:9200
    volumes:
    - final_search:/usr/share/elasticsearch/data
    mem_limit: 1536m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s'
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.10.0
    ports:
    - 127.0.0.1:23909:9090
    volumes:
    - ./.local/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ../acceptance/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    - ./.local/observability/internal-token:/etc/prometheus/internal-token:ro
    - final_prometheus:/prometheus
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 30
  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${FINAL_GRAFANA_PASSWORD:?Set private final .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    ports:
    - 127.0.0.1:23930:3000
    volumes:
    - ../acceptance/observability/grafana:/etc/grafana/provisioning:ro
    - ../acceptance/observability/dashboards:/var/lib/grafana/dashboards:ro
    - final_grafana:/var/lib/grafana
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 30
  web-student:
    image: tianji-final/student:ux-20261007
    restart: unless-stopped
    environment:
      GW_UPSTREAM: app-gateway:23310
    ports:
    - 127.0.0.1:23500:8080
    - 127.0.0.1:80:8080
    mem_limit: 128m
    depends_on:
      app-gateway:
        condition: service_healthy
  web-admin:
    image: tianji-final/admin:ux-20261007
    restart: unless-stopped
    environment:
      GW_UPSTREAM: app-gateway:23310
    ports:
    - 127.0.0.1:23501:8080
    - 127.0.0.1:81:8080
    mem_limit: 128m
    depends_on:
      app-gateway:
        condition: service_healthy
volumes:
  final_mysql: {}
  final_redis: {}
  final_rabbit: {}
  final_search: {}
  final_prometheus: {}
  final_grafana: {}
