name: tianji-final
services:
  app-data:
    image: tianji-final/data:ee045c7
    restart: unless-stopped
    env_file:
    - ./.local/app.env
    environment:
      APP_PORT: '23895'
    ports:
    - 127.0.0.1:23895:23895
    volumes:
    - ./.local/configs/data.yml:/run/acceptance/application.yml:ro
    - ./.local/signing.jks:/run/acceptance/signing.jks:ro
    - ./.local/objects:/run/objects
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test:
      - CMD
      - java
      - -Xms16m
      - -Xmx32m
      - -cp
      - /app/health
      - HealthProbe
      interval: 10s
      timeout: 4s
      start_period: 40s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  app-pay:
