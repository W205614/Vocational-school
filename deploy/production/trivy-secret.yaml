# Bare DER/Base64 private keys in payment SDK configuration lack PEM markers.
# Custom rules extend Trivy's built-in rules; none are disabled here.
rules:
  - id: zhixuetang-raw-private-key
    category: asymmetric-private-key
    title: Bare Base64 private key assignment
    severity: HIGH
    keywords:
      - private
    regex: '(?im)(?:^|[^a-z0-9_])(?:app[-_]?)?private[-_]?key["'']?[ \t]*[:=][ \t]*["'']?(?P<secret>MII[A-Za-z0-9+/]{125,}={0,2})(?:["''; \t\r\n]|$)'
    secret-group-name: secret
