name: Production security and deployment contracts
on:
  push:
    branches: [dev, master, main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r deploy/production/requirements.txt
      - name: Production package and negative evidence contracts
        run: python -m unittest discover -s deploy/production -p 'test_*.py' -v
      - name: Resolve runtime dependencies and produce source-bound SBOM
        run: python deploy/production/build_sbom.py --commit '${{ github.sha }}'
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with: {version: v0.76.1, cache: true}
      - name: Verify standalone Nacos runtime packaging
        run: |
          mvn -B -pl tj-gateway -am -Dtest=NacosSdkRuntimeTest -Dsurefire.failIfNoSpecifiedTests=false package
          python deploy/production/check_nacos_runtime.py tj-gateway/target/tj-gateway.jar
      - name: Gate dependency vulnerabilities and repository secrets
        run: python deploy/production/security_scan.py source --commit '${{ github.sha }}' --standalone-jar tj-gateway/target/tj-gateway.jar --output .local/security-source.json
      - name: Build isolated media worker artifact
        run: mvn -B -pl tj-media -am -Pcompact,media-worker -DskipTests package
      - name: Build and scan worker container
        shell: bash
        run: |
          mkdir -p .local/security-worker
          cp tj-media/target/tj-media-worker.jar .local/security-worker/tj-media-worker.jar
          cp tj-media/docker/Dockerfile.worker .local/security-worker/Dockerfile
          docker build --build-arg VCS_REF=${{ github.sha }} -t tianji-security/media-worker:${{ github.sha }} .local/security-worker
          python -c 'import json,subprocess; from pathlib import Path; image="tianji-security/media-worker:${{ github.sha }}"; identity=subprocess.check_output(["docker","image","inspect",image,"--format","{{.Id}}"],text=True).strip(); Path(".local/security-worker/images.json").write_text(json.dumps({"media-worker":{"imageId":identity}}))'
          python deploy/production/security_scan.py images --commit '${{ github.sha }}' --required-images media-worker --images-file .local/security-worker/images.json --output .local/security-worker.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-security-sanitized
          include-hidden-files: true
          path: |
            target/bom.json
            target/security-bom-binding.json
            .local/security-source.json
            .local/security-worker.json
