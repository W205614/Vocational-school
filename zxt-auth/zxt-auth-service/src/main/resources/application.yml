server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8
  shutdown: graceful
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auth-service
  cloud:
    nacos:
      config:
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1500
            readTimeout: 5000
            loggerLevel: basic
  config:
    import:
      - optional:nacos:shared-spring.yaml?refreshEnabled=false
      - optional:nacos:shared-redis.yaml?refreshEnabled=false
      - optional:nacos:shared-mybatis.yaml?refreshEnabled=false
      - optional:nacos:shared-logs.yaml?refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
encrypt:
  key-store:
    alias: tjxt
    location: classpath:local-demo.jks
    password: ${ZXT_AUTH_ENCRYPT_KEY_STORE_PASSWORD:}
    secret: ${ZXT_AUTH_ENCRYPT_KEY_STORE_SECRET:}
zxt:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhixuetang.auth.controller
    title: 职学堂 - 权限微服务接口文档
    description: 该服务用于管理权限相关信息
    contact-name: 职学堂维护者
    contact-url: https://github.com/W205614/Vocational-school
    version: v1.0
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /menus/me
        - /accounts/logout
  jdbc:
    database: tj_auth
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
          additional-path: server:/readyz
